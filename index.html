<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<title>Kitchen Dashboard</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#fff}
body{
background:linear-gradient(125deg,#ff7eb3 0%,#ff758c 24%,#8f94fb 52%,#65d6ce 76%,#ffd86f 100%);
background-size:220% 220%;
animation:bg 18s ease infinite;
}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
*{box-sizing:border-box}
.wrap{height:100%;padding:28px 34px;display:flex;gap:24px}
.left{width:56%;display:flex;flex-direction:column}
.right{width:44%;display:flex;flex-direction:column;gap:18px}
.clock{font-size:104px;line-height:.95;font-weight:300;letter-spacing:-5px;text-shadow:0 3px 20px rgba(0,0,0,.15)}
.date{font-size:28px;font-weight:600;margin-top:12px;text-shadow:0 2px 12px rgba(0,0,0,.12)}
.greeting{font-size:20px;margin-top:8px;opacity:.92}
.card{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.36);border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.today{margin-top:auto}
.card h2{margin:0 0 13px;font-size:20px;text-transform:uppercase;letter-spacing:2px}
.event{display:flex;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.24)}
.event:first-of-type{border-top:0}
.dot{width:11px;height:11px;border-radius:50%;background:#fff;margin-right:12px}
.event .time{width:95px;font-weight:700}
.event .name{font-size:18px}
.monthHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.monthTitle{font-size:26px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:5px}
.dow{font-size:12px;font-weight:700;opacity:.8;padding:3px}
.day{height:34px;line-height:34px;border-radius:50%;font-size:15px}
.day.todayDay{background:#fff;color:#735fc7;font-weight:800}
.day.muted{opacity:.32}
.note{flex:1}
.note p{font-size:18px;line-height:1.45;margin:7px 0;opacity:.95}
.small{font-size:13px!important;opacity:.72!important;margin-top:12px!important}

button{border:0;border-radius:10px;padding:7px 10px;background:rgba(255,255,255,.9);color:#6658aa;font-weight:bold;float:right}
.del{float:none;background:transparent;color:white;font-size:18px;padding:2px 8px}
.remrow{padding:9px 0;border-top:1px solid rgba(255,255,255,.24);font-size:17px}
.empty{opacity:.75;font-style:italic;padding:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <section class="left">
    <div id="clock" class="clock">12:00 PM</div>
    <div id="date" class="date">Monday, September 7</div>
    <div id="greeting" class="greeting">Good afternoon 🌈</div>

    <div class="card today">
      <h2>Today <button onclick="addEvent()">+ Add Event</button></h2>
      <div id="events"></div>
    </div>
  </section>

  <section class="right">
    <div class="card">
      <div class="monthHead"><span id="monthTitle" class="monthTitle">September 2026</span><span>📅</span></div>
      <div id="calendar" class="grid"></div>
    </div>
    <div class="card note">
      <h2>Reminders <button onclick="addReminder()">+ Add</button></h2>
      <div id="reminders"></div>
      <p class="small">Your changes save on this iPad.</p>
    </div>
  </section>
</div>
<script>
(function(){
function pad(n){return n<10?"0"+n:n}
function tick(){
 var d=new Date(), h=d.getHours(), m=d.getMinutes(), ap=h>=12?"PM":"AM", h12=h%12||12;
 document.getElementById("clock").innerHTML=h12+":"+pad(m)+" "+ap;
 var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
 var months=["January","February","March","April","May","June","July","August","September","October","November","December"];
 document.getElementById("date").innerHTML=days[d.getDay()]+", "+months[d.getMonth()]+" "+d.getDate();
 var hr=d.getHours(), g=hr<12?"Good morning ☀️":hr<18?"Good afternoon 🌈":"Good evening ✨";
 document.getElementById("greeting").innerHTML=g;
}
function makeCal(){
 var d=new Date(), y=d.getFullYear(), m=d.getMonth(), today=d.getDate();
 var months=["January","February","March","April","May","June","July","August","September","October","November","December"];
 document.getElementById("monthTitle").innerHTML=months[m]+" "+y;
 var el=document.getElementById("calendar"), names=["S","M","T","W","T","F","S"], out="";
 for(var i=0;i<7;i++) out+='<div class="dow">'+names[i]+'</div>';
 var first=new Date(y,m,1).getDay(), count=new Date(y,m+1,0).getDate();
 for(i=0;i<first;i++) out+='<div class="day muted"></div>';
 for(i=1;i<=count;i++) out+='<div class="day '+(i===today?'todayDay':'')+'">'+i+'</div>';
 el.innerHTML=out;
}

function load(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function safe(s){var x=document.createElement("div");x.appendChild(document.createTextNode(s));return x.innerHTML}
function renderEvents(){
 var a=load("kd_events"),o="",i;
 if(!a.length)o='<div class="empty">No events yet. Tap + Add Event.</div>';
 for(i=0;i<a.length;i++)o+='<div class="event"><span class="dot"></span><span class="time">'+safe(a[i].time)+'</span><span class="name">'+safe(a[i].name)+'</span><button class="del" onclick="delEvent('+i+')">×</button></div>';
 document.getElementById("events").innerHTML=o;
}
function addEvent(){
 var t=prompt("What time? Example: 3:30 PM",""), n;
 if(t===null)return;
 n=prompt("What is the event?","");
 if(!n)return;
 var a=load("kd_events");a.push({time:t||"All day",name:n});save("kd_events",a);renderEvents();
}
function delEvent(i){var a=load("kd_events");if(confirm("Remove this event?")){a.splice(i,1);save("kd_events",a);renderEvents()}}
function renderReminders(){
 var a=load("kd_reminders"),o="",i;
 if(!a.length)o='<div class="empty">No reminders yet. Tap + Add.</div>';
 for(i=0;i<a.length;i++)o+='<div class="remrow">○ '+safe(a[i])+' <button class="del" onclick="delReminder('+i+')">×</button></div>';
 document.getElementById("reminders").innerHTML=o;
}
function addReminder(){var n=prompt("Add a reminder:","");if(!n)return;var a=load("kd_reminders");a.push(n);save("kd_reminders",a);renderReminders()}
function delReminder(i){var a=load("kd_reminders");if(confirm("Remove this reminder?")){a.splice(i,1);save("kd_reminders",a);renderReminders()}}

tick();makeCal();renderEvents();renderReminders();setInterval(tick,1000);setInterval(makeCal,60000);
})();
</script>
</body>
</html>
